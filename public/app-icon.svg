<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Metallic Gold / Emerald Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Badge Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.45" />
    </filter>

    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Main Shield / Delivery Wallet Symbol -->
  <g transform="translate(48, 48)">
    <!-- WhatsApp Chat Bubble Background Accent -->
    <path d="M 330 110 C 330 60 280 20 205 20 C 130 20 70 65 70 120 C 70 152 86 181 112 200 L 98 238 L 142 222 C 161 228 182 232 205 232 C 280 232 330 185 330 125 Z" 
          fill="rgba(16, 185, 129, 0.35)" />

    <!-- Wallet Body -->
    <rect x="76" y="150" width="264" height="175" rx="32" fill="url(#walletGrad)" filter="url(#shadow)" />
    
    <!-- Wallet Flap / Top detail -->
    <path d="M 76 195 L 340 195" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 6" />

    <!-- Wallet Pocket Clasp -->
    <rect x="250" y="205" width="90" height="66" rx="20" fill="#047857" stroke="#ffffff" stroke-width="4" />
    <!-- Clasp Gold Coin / Button -->
    <circle cx="282" cy="238" r="13" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" />
    
    <!-- Cash Bills protruding from Wallet -->
    <rect x="110" y="112" width="180" height="52" rx="12" fill="#a7f3d0" stroke="#059669" stroke-width="3.5" transform="rotate(-6 110 112)" />
    <circle cx="200" cy="138" r="10" fill="#059669" opacity="0.6" transform="rotate(-6 110 112)" />
    
    <!-- Delivery Speed Marks / Wings on Left -->
    <path d="M 35 205 L 62 205" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <path d="M 20 235 L 56 235" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <path d="M 40 265 L 64 265" stroke="#34d399" stroke-width="8" stroke-linecap="round" />

    <!-- Floating Badge: WhatsApp Chat / Checkmark Icon -->
    <g transform="translate(250, 60)">
      <circle cx="48" cy="48" r="44" fill="#25D366" filter="url(#shadow)" stroke="#ffffff" stroke-width="5" />
      <!-- WhatsApp phone / chat glyph -->
      <path d="M 48 24 C 34.7 24 24 34.7 24 48 C 24 52.8 25.4 57.3 27.9 61.1 L 25 71 L 35.3 68.3 C 38.9 70.3 43.3 71.5 48 71.5 C 61.3 71.5 72 60.8 72 48 C 72 34.7 61.3 24 48 24 Z" fill="#ffffff" />
      <path d="M 41.5 37 C 40.8 35.5 40 35.5 39.3 35.5 C 38.7 35.5 38 35.5 37.3 36.2 C 36.6 37 34.7 38.8 34.7 42.4 C 34.7 46 37.4 49.4 37.7 49.9 C 38.1 50.4 43.1 58 50.6 61.2 C 56.9 63.8 58.1 62.7 59.5 62.6 C 60.8 62.4 63.8 60.8 64.4 59 C 65 57.3 65 55.7 64.8 55.4 C 64.6 55.1 64 54.9 63.1 54.5 C 62.2 54 57.7 51.8 56.9 51.5 C 56 51.2 55.4 51.1 54.8 52 C 54.2 52.9 52.4 55.1 51.8 55.7 C 51.3 56.4 50.7 56.5 49.8 56 C 48.9 55.6 46.1 54.7 42.7 51.6 C 40.1 49.3 38.3 46.4 37.8 45.5 C 37.3 44.7 37.8 44.2 38.2 43.8 C 38.6 43.4 39.1 42.8 39.5 42.3 C 40 41.8 40.1 41.4 40.4 40.8 C 40.7 40.2 40.5 39.7 40.3 39.3 C 40.1 38.8 39.4 37.1 41.5 37 Z" fill="#25D366" />
    </g>
  </g>
</svg>
